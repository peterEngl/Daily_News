<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self' https://api.coingecko.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily News</title>
<link rel="stylesheet" href="./style.css">
<script type="module" src="./app.js"></script>
</head>
<body>
<div class="sheet">

<header class="masthead">
  <div class="brandrow">
    <div>
      <h1>Daily News</h1>
      <p class="claim">Tageszeitung für KI, Games und Krypto</p>
    </div>
    <p class="issue"><span id="ausgabe-nr">Ausgabe</span><span>Deutsche Ausgabe</span></p>
  </div>
  <div class="navrow">
    <span class="pill" id="ausgabe-datum">Wird geladen …</span>
    <nav class="res" aria-label="Ressorts" id="nav-ressorts"></nav>
    <p class="closing" id="redaktionsschluss"></p>
  </div>
  <p class="hinweis" id="ausgabe-hinweis" hidden></p>
</header>

<noscript><p class="ladefehler tile">Daily News braucht JavaScript, um die Ausgabe anzuzeigen.</p></noscript>
<p class="ladefehler tile" id="ladefehler" hidden>Die Ausgabe konnte nicht geladen werden. Bitte später erneut versuchen.</p>

<main>

<!-- Kurstafel: Werte kommen live von CoinGecko (kurse.js) -->
<section class="ticker" aria-labelledby="board-h">
  <h2 id="board-h">Kurstafel</h2>
  <table role="table" aria-labelledby="board-h">
    <thead role="rowgroup"><tr role="row"><th role="columnheader">Wert</th><th role="columnheader">Kurs (USD)</th><th role="columnheader">24 Std.</th></tr></thead>
    <tbody role="rowgroup" id="kurstafel-body"></tbody>
  </table>
  <p class="note" id="kurstafel-hinweis">Kurse werden geladen. Keine Anlageberatung.</p>
</section>

<div class="leadrow">
  <section class="lead tile" id="aufmacher" aria-labelledby="lead-h"></section>
  <section class="dates tile" id="termine" aria-labelledby="termine-h">
    <h2 id="termine-h">Was diese Woche ansteht</h2>
    <ol id="termine-liste"></ol>
  </section>
</div>

<div id="ressorts"></div>

</main>

<footer id="fussnote"></footer>

</div>
</body>
</html>
